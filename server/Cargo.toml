[package]
name = "plateau-server"
description = "A low-profile event and log aggregator"

version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
anyhow = "1"
bytes = "1.6"
bytesize = { version = "1.1.0", features = ["serde"] }
config = "0.14"
futures = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
humantime-serde = "1"
serde_json = "1"
serde_qs = { version = "0.12" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tokio-stream = { version = "0.1", features = ["signal"] }
tokio = { version = "1", features = ["full"] }

axum.workspace = true
chrono.workspace = true
headers.workspace = true
thiserror.workspace = true
tower-http.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true

plateau-catalog.workspace = true
plateau-client = { workspace = true, features = ["replicate"] }
plateau-data.workspace = true
plateau-transport.workspace = true

# Arrow-rs dependencies
arrow = "55.2.0"
arrow-array = "55.2.0"
arrow-schema = "55.2.0"
arrow-select = "55.2.0"
arrow-data = "55.2.0"
arrow-buffer = "55.2.0"
arrow-cast = "55.2.0"
arrow-json = "55.2.0"
arrow-ipc = "55.2.0"


[dev-dependencies]
tempfile = "3"
test-log = { version = "0.2", default-features = false, features = ["trace"] }
uuid = { version = "1.10", features = ["v4"] }

reqwest.workspace = true

plateau-client.workspace = true
plateau-test.workspace = true


[lints]
workspace = true
