[package]
name = "bench"

version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
humantime-serde = "1"
humantime = "2"

sample-std = "0.2.1"
sample-arrow-rs = "55.2.0"

arrow-ipc = "55.2.0"
arrow-array = "55.2.0"
arrow-schema = "55.2.0"

plateau-transport.workspace = true

futures = "0.3"
hdrhistogram = "7.5"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

reqwest.workspace = true

plateau-server.workspace = true
plateau-client = { workspace = true, features = ["health"] }


[[bin]]
name = "cv"

[[bin]]
name = "load"

[[bin]]
name = "batch-load"
path = "src/bin/batch_load.rs"
