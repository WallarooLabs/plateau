[package]
name = "plateau-data"
description = "Data processing for the plateau server"

version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true


[dependencies]
anyhow = "1"
bytes = "1.6"
bytesize = { version = "1.1.0", features = ["serde"] }
chrono = "0.4"
config = "0.14"
futures = "0.3"
itertools = "0.13"
# Removed parquet2 dependency
# parquet2 = { version = "0.17", default-features = false }
# parquet-format-safe = "0.2"
humantime-serde = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tokio-stream = { version = "0.1", features = ["signal"] }
tokio = { version = "1", features = ["full"] }

# Arrow RS dependencies
arrow = { version = "55.2.0", features = [
  "ipc",
  "csv",
  "json",
] }
arrow-array = "55.2.0"
arrow-schema = "55.2.0"
arrow-buffer = "55.2.0"
arrow-data = "55.2.0"
arrow-select = "55.2.0"
arrow-cast = "55.2.0"
arrow-json = "55.2.0"
arrow-ipc = "55.2.0"

thiserror.workspace = true

# Use arrow-rs versions of transport and client
plateau-transport.workspace = true
plateau-client.workspace = true


[dev-dependencies]
tempfile = "3"
test-log = { version = "0.2", default-features = false, features = ["trace"] }
uuid = { version = "1.10", features = ["v4"] }

# Remove sample-arrow2 as we're migrating to arrow-rs
sample-test = "0.2.1"
sample-std = "0.2.1"
sample-arrow-rs = "55.2.0"

reqwest.workspace = true

# Use arrow-rs versions for testing
plateau-client.workspace = true
plateau-test.workspace = true


[lints]
workspace = true
